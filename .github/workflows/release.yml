name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete mingw-w64 g++-mingw-w64-i686 zip
      - name: Build and test
        run: ./build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o 'Version = "[0-9.]*"' managed/Plugin.cs | grep -o '[0-9.]*')
          gh release create "v$VER" dist/FtpSync-*.zip dist/FtpSync_v*.zip --target "${GITHUB_SHA}" \
            --title "FTP Sync $VER" \
            --notes "Notepad++ plugin. Unzip FtpSync into plugins\\ (x64 or x86 archive), restart Notepad++. See README.md."
